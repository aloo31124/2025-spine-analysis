<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>拍攝/上傳照片示範</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f0f0f0;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      margin: 0 8px;
      padding: 10px 20px;
      font-size: 16px;
    }
    #preview, #finalImage {
      max-width: 90vw;
      max-height: 60vh;
      margin-top: 10px;
      display: none;
      border: 2px solid #ccc;
      background: #fff;
    }
    #cropArea {
      position: relative;
      display: none;
    }
    #cropOverlay {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60%;
      height: 60%;
      transform: translate(-50%, -50%);
      border: 2px dashed #3DA5FF;
    }
  </style>
</head>
<body>

<div class="controls">
  <button id="captureBtn">拍攝照片</button>
  <button id="uploadBtn">上傳照片</button>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
<input type="file" id="fileInput" accept="image/*" style="display:none;">

<div id="cropArea">
  <img id="preview" alt="預覽">
  <div id="cropOverlay"></div>
  <button id="confirmCrop" style="margin-top:10px;">上傳照片</button>
</div>

<img id="finalImage" alt="完成圖片">

<script>
const captureBtn = document.getElementById('captureBtn');
const uploadBtn  = document.getElementById('uploadBtn');
const cameraInput = document.getElementById('cameraInput');
const fileInput = document.getElementById('fileInput');
const preview = document.getElementById('preview');
const cropArea = document.getElementById('cropArea');
const confirmCrop = document.getElementById('confirmCrop');
const finalImage = document.getElementById('finalImage');

let currentImage = null;

// 拍攝照片
captureBtn.addEventListener('click', () => {
  cameraInput.click(); // 在電腦會叫鏡頭，在手機會打開相機
});

// 上傳照片
uploadBtn.addEventListener('click', () => {
  if (currentImage) {
    // 已裁切/選擇完，顯示結果
    showFinalImage(currentImage);
  } else {
    fileInput.click();
  }
});

cameraInput.addEventListener('change', handleFile);
fileInput.addEventListener('change', handleFile);

function handleFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    preview.src = evt.target.result;
    preview.style.display = "block";
    cropArea.style.display = "flex";
    currentImage = evt.target.result;
  }
  reader.readAsDataURL(file);
}

confirmCrop.addEventListener('click', () => {
  // 簡易裁切（此處直接使用整張圖，如需裁切可搭配 canvas 或 Cropper.js）
  showFinalImage(preview.src);
});

function showFinalImage(src){
  cropArea.style.display = "none";
  finalImage.src = src;
  finalImage.style.display = "block";
}
</script>

</body>
</html>
