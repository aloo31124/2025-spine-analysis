# ====================================
# 頸椎分析系統 - GCP Cloud Build 自動部署
# 前後端一次部署至 Cloud Run
# ====================================
#
# 使用方式:
#   gcloud builds submit --config cloudbuild.yaml
# GCP:
#  測試 專案id : spineanalysis1006test1 
#  正式 專案id : spineanalysis 
# 測試網址(cloud run):
#   https://spineanalysis20260408test1-882466139693.asia-east1.run.app/
#
substitutions:
  # 注意：Project ID 與 Docker Image 名稱都必須為小寫。
  # 若你的目標專案不是 spineanalysis，請改成實際的小寫 project id。
  _GCP_PROJECT_ID: spineanalysis
  _REGION: asia-east1
  _SERVER_SERVICE: spine-server
  _CLIENT_SERVICE: spine-client

steps:
  # ========== 後端部署 ==========
  # Step 1: 建置後端 Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
      - './spine-server'
    id: 'build-server'

  # Step 2: 推送後端 Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest']
    id: 'push-server'
    waitFor: ['build-server']

  # Step 3: 部署後端至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVER_SERVICE}'
      - '--image=gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
      - '--project=${_GCP_PROJECT_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8083'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--allow-unauthenticated'
      - '--set-env-vars=NODE_ENV=production'
    id: 'deploy-server'
    waitFor: ['push-server']

  # Step 4: 取得後端 URL 供前端使用
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVER_URL=$(gcloud run services describe ${_SERVER_SERVICE} --project=${_GCP_PROJECT_ID} --region=${_REGION} --format='value(status.url)')
        echo "$${SERVER_URL}/" > /workspace/server_url.txt
        echo "後端 URL: $${SERVER_URL}"
    id: 'get-server-url'
    waitFor: ['deploy-server']

  # ========== 前端部署 ==========
  # Step 5: 建置前端 Docker Image (使用後端 URL)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: bash
    args:
      - '-c'
      - |
        SERVER_URL=$(cat /workspace/server_url.txt)
        echo "前端連接後端 URL: $${SERVER_URL}"
        docker build \
          --build-arg REACT_APP_BASE_URL=$${SERVER_URL} \
          -t gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest \
          ./spine-client
    id: 'build-client'
    waitFor: ['get-server-url']

  # Step 6: 推送前端 Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest']
    id: 'push-client'
    waitFor: ['build-client']

  # Step 7: 部署前端至 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_CLIENT_SERVICE}'
      - '--image=gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest'
      - '--project=${_GCP_PROJECT_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--allow-unauthenticated'
    id: 'deploy-client'
    waitFor: ['push-client']

images:
  - 'gcr.io/${_GCP_PROJECT_ID}/${_SERVER_SERVICE}:latest'
  - 'gcr.io/${_GCP_PROJECT_ID}/${_CLIENT_SERVICE}:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
