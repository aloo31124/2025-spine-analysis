# Cloud Build 設定檔 - 用於 GCP Cloud Run + Firebase Hosting 自動部署
# 此檔案用於 Cloud Build 觸發器，自動建置並部署到 Cloud Run 和 Firebase Hosting

steps:
  # ========================================
  # 步驟 1: 建置前端 React 應用程式 (用於 Firebase Hosting)
  # ========================================
  - name: 'node:20-alpine' 
    entrypoint: npm
    args: ['ci']
    dir: 'spine-client'

  - name: 'node:20-alpine'
    entrypoint: npm
    args: ['run', 'build']
    dir: 'spine-client'
    # 不設定 REACT_APP_BASE_URL，讓 React 使用 .env.production 的設定

  # ========================================
  # 步驟 2: 部署前端到 Firebase Hosting (使用 Google Cloud 認證)
  # ========================================
  - name: 'node:20'
    entrypoint: bash
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID
    dir: 'spine-client'

  # ========================================
  # 步驟 3: 建置 Docker 映像檔 (後端 + 前端整合版)
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spine-analysis:latest'
      - '--build-arg'
      - 'REACT_APP_BASE_URL=/'
      - '.'

  # ========================================
  # 步驟 4: 推送映像檔到 Container Registry
  # ========================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spine-analysis:latest'

  # ========================================
  # 步驟 5: 部署到 Cloud Run
  # ========================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spine-analysis'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'

# 替代變數
substitutions:
  _REGION: us-central1
  _COMMIT_SHA: latest

# 映像檔列表
images:
  - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
  - 'gcr.io/$PROJECT_ID/spine-analysis:latest'

# 建置選項
options:
  logging: CLOUD_LOGGING_ONLY
