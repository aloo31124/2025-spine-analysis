# Cloud Build 設定檔 - 用於 GCP Cloud Run 自動部署
# 此檔案用於 Cloud Build 觸發器，自動建置並部署到 Cloud Run

steps:
  # 步驟 1: 建置 Docker 映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
      - '-t'
      - 'gcr.io/$PROJECT_ID/spine-analysis:latest'
      - '--build-arg'
      - 'REACT_APP_BASE_URL=/'
      - '.'

  # 步驟 2: 推送映像檔到 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/spine-analysis:latest'

  # 步驟 3: 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'spine-analysis'
      - '--image'
      - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--port'
      - '8080'

# 替代變數
substitutions:
  _REGION: us-central1
  _COMMIT_SHA: latest

# 映像檔列表
images:
  - 'gcr.io/$PROJECT_ID/spine-analysis:${_COMMIT_SHA}'
  - 'gcr.io/$PROJECT_ID/spine-analysis:latest'

# 建置選項
options:
  logging: CLOUD_LOGGING_ONLY
